<!doctype html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17365d"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><title>Budget Tracker</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f6f9;margin:0;padding:16px;color:#16202a}
.app{max-width:620px;margin:auto}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px}
header{background:#17365d;color:#fff;border-radius:20px;padding:20px;margin-bottom:14px}
h1{margin:0}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#fff;border-radius:16px;padding:14px;text-align:center}
.val{font-size:24px;font-weight:800}.green{color:#2f7d32}.danger{color:#b42318}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:13px;color:#667085;font-weight:700}
input,select{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:12px;font-size:16px;box-sizing:border-box}
button{width:100%;padding:13px;border:0;border-radius:12px;background:#17365d;color:#fff;font-weight:800;margin-top:10px}
.progress{height:12px;background:#e7ebef;border-radius:999px;overflow:hidden}.progress div{height:100%;background:#17365d}
.exp{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.muted{font-size:12px;color:#667085}
canvas{width:100%;max-width:340px;display:block;margin:auto}
@media(max-width:430px){.metrics,.row{grid-template-columns:1fr}}
</style></head><body><div class="app">
<header><h1>Monthly Budget Tracker</h1><div>$750 budget • resets on the 1st</div></header>
<div class="metrics">
<div class="metric"><div class="muted">BUDGET</div><div class="val">$750.00</div></div>
<div class="metric"><div class="muted">SPENT</div><div class="val" id="spent">$0.00</div></div>
<div class="metric"><div class="muted">REMAINING</div><div class="val green" id="remaining">$750.00</div></div>
</div>
<div class="card"><div style="display:flex;justify-content:space-between"><strong id="month"></strong><span class="muted" id="daily"></span></div><div class="progress"><div id="bar" style="width:0%"></div></div></div>
<div class="card"><strong>Add expense</strong><div class="row" style="margin-top:12px">
<div><label>Amount</label><input id="amount" type="number" step="0.01"></div>
<div><label>Category</label><select id="category"><option>Food</option><option>Gas / Transportation</option><option>Shopping</option><option>Entertainment</option><option>Bills</option><option>Other</option></select></div></div>
<div class="row" style="margin-top:10px"><div><label>Description</label><input id="desc"></div><div><label>Date</label><input id="date" type="date"></div></div>
<button id="add">Add expense</button></div>
<div class="card"><strong>Spending by category</strong><canvas id="pie" width="340" height="340"></canvas><div id="legend"></div></div>
<div class="card"><strong>Transactions</strong><div id="tx"></div><button id="clear" style="background:#e7ebef;color:#344054">Clear this month</button></div>
<div class="muted">Data is stored locally on this device/browser. Older months remain stored unless browser data is cleared.</div>
</div><script>
const B=750,C=["#3d6da3","#5c8f5b","#c69034","#9a5b8c","#b85b52","#68717d"],$=x=>document.getElementById(x),money=n=>n.toLocaleString("en-US",{style:"currency",currency:"USD"});
const now=new Date(),key=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
function all(){return JSON.parse(localStorage.getItem("budget-data")||"{}")} function items(){let a=all();if(!a[key])a[key]=[];localStorage.setItem("budget-data",JSON.stringify(a));return a[key]}
function save(v){let a=all();a[key]=v;localStorage.setItem("budget-data",JSON.stringify(a))}
function pie(t){let c=$("pie"),x=c.getContext("2d");x.clearRect(0,0,340,340);let s=Object.values(t).reduce((a,b)=>a+b,0);if(!s){x.fillStyle="#e6e9ed";x.beginPath();x.arc(170,170,105,0,Math.PI*2);x.fill();return}let st=-Math.PI/2,i=0;for(let [k,v] of Object.entries(t)){let en=st+v/s*Math.PI*2;x.fillStyle=C[i++%C.length];x.beginPath();x.moveTo(170,170);x.arc(170,170,110,st,en);x.fill();st=en}x.fillStyle="#fff";x.beginPath();x.arc(170,170,62,0,Math.PI*2);x.fill();x.fillStyle="#16202a";x.font="700 19px -apple-system";x.textAlign="center";x.fillText(money(s),170,176)}
function render(){let a=items(),s=a.reduce((q,e)=>q+e.amount,0),r=B-s;$("spent").textContent=money(s);$("remaining").textContent=money(r);$("remaining").className="val "+(r<0?"danger":"green");$("bar").style.width=Math.min(100,s/B*100)+"%";$("month").textContent=now.toLocaleDateString("en-US",{month:"long",year:"numeric"});let dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(),left=Math.max(1,dim-now.getDate()+1);$("daily").textContent=money(Math.max(0,r)/left)+"/day left";let t={};a.forEach(e=>t[e.category]=(t[e.category]||0)+e.amount);pie(t);$("legend").innerHTML=Object.entries(t).sort((a,b)=>b[1]-a[1]).map((e,i)=>`<div class="exp"><span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${C[i%C.length]};margin-right:7px"></span>${e[0]}</span><strong>${money(e[1])}</strong></div>`).join("");$("tx").innerHTML=[...a].sort((x,y)=>y.date.localeCompare(x.date)).map(e=>`<div class="exp"><span><strong>${e.desc||e.category}</strong><div class="muted">${e.category} • ${e.date}</div></span><strong>${money(e.amount)}</strong></div>`).join("")||'<div class="muted" style="padding:10px 0">No transactions yet.</div>'}
$("add").onclick=()=>{let v=parseFloat($("amount").value);if(!(v>0))return;let a=items();a.push({amount:v,category:$("category").value,desc:$("desc").value,date:$("date").value||new Date().toISOString().slice(0,10)});save(a);$("amount").value="";$("desc").value="";render()};$("clear").onclick=()=>{if(confirm("Clear this month?")){save([]);render()}};$("date").value=new Date().toISOString().slice(0,10);render();
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
</script></body></html>
